# CI pipeline for the Lumax API gateway.
#
# Why this exists: the gateway ships as a deployable service, so every push to
# `main` and every PR must prove that the code still installs, type-checks,
# lints, builds and passes its unit tests before it can be redeployed. This is
# the "updates don't require manual redeploys" guarantee — a red pipeline blocks
# the merge instead of shipping a broken build.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server:
    name: Server (NestJS + Prisma)
    runs-on: ubuntu-latest

    # A throwaway Postgres is spun up for the job so Prisma can generate its
    # client and any DB-touching test can talk to a real engine, not a mock.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lumax
          POSTGRES_PASSWORD: lumax
          POSTGRES_DB: lumax_test
        ports:
          - 5432:5432
        # Don't start the job until Postgres actually accepts connections.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Points Prisma at the ephemeral service container above.
      DATABASE_URL: postgresql://lumax:lumax@localhost:5432/lumax_test?schema=public

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: server/pnpm-lock.yaml

      # --frozen-lockfile fails fast if the lockfile is stale, so CI never
      # silently resolves different versions than local dev.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Prisma client must be generated before tsc/jest can resolve @prisma/client.
      - name: Generate Prisma client
        run: pnpm prisma:generate

      # eslint without --fix: CI reports violations, it must not mutate files.
      - name: Lint
        run: pnpm exec eslint "{src,apps,libs,test}/**/*.ts"

      - name: Build
        run: pnpm build

      - name: Unit tests
        run: pnpm test
